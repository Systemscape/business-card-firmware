[package]
name = "business-card-firmware"
version = "0.1.0"
edition = "2021"
resolver = "2"

[dependencies]
embassy-executor = { version = "0.10", default-features = false, features = ["platform-cortex-m", "executor-thread", "defmt", "executor-interrupt"] }
embassy-time = { version = "0.5", default-features = false, features = ["defmt", "defmt-timestamp-uptime"] }
embassy-nrf = { version = "0.11", default-features = false, features = ["defmt", "time-driver-rtc1", "gpiote", "unstable-pac", "rt", "nrf52810", "nfc-pins-as-gpio"] }
embassy-futures = "0.1.1"
embassy-sync = { version = "0.8", features = ["defmt"] }

nrf-sdc = { version = "0.4", default-features = false, features = ["defmt", "peripheral", "nrf52810"] }
nrf-mpsl = { version = "0.3", default-features = false, features = ["defmt", "critical-section-impl"] }
bt-hci = { version = "0.10", default-features = false, features = ["defmt"] }
trouble-host = { git = "https://github.com/embassy-rs/trouble", rev = "ff0aa1a21b73e0b82b97230aebcef14c3d7d0fbf", default-features = false, features = [
    "derive",
    "gatt",
    "peripheral",
    "defmt",
    "security",
    "security-p256-cortex-m4",
    "serde",
    "l2cap-rx-queue-size-2",
    "l2cap-tx-queue-size-2",
    "default-packet-pool-mtu-128",
    "default-packet-pool-size-4",
    "client-att-table-size-16",
] }

defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }

cortex-m = "0.7.6"
cortex-m-rt = "0.7.0"
static_cell = "2"
heapless = { version = "0.9", features = ["serde"] }
sequential-storage = { version = "7.1.0", features = ["postcard"] }
embedded-storage-async = "0.4.1"
serde = { version = "1.0", default-features = false, features = ["derive"] }

[patch.crates-io]
nrf-sdc = { git = "https://github.com/alexmoon/nrf-sdc.git", rev = "1a6e661155cdd1d6a86f3ae7b7fb117343781533" }
nrf-mpsl = { git = "https://github.com/alexmoon/nrf-sdc.git", rev = "1a6e661155cdd1d6a86f3ae7b7fb117343781533" }

# opt-level z merges async poll-stack frames aggressively; trouble-host's runner
# frame gets so large that SMP + ECDH + radio IRQs overflow the 24K RAM stack.
[profile.release.package.trouble-host]
opt-level = 2

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
debug = 2
